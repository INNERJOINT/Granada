name: release-please
on:
  push:
    branches:
      - release

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-to-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Force-sync master to release
        run: git push --force origin release:master

  release-please:
    needs: sync-to-master
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: master

      - name: Merge Release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBER="${{ fromJson(steps.release.outputs.pr).number }}"
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          gh pr merge --squash --delete-branch --body "$PR_BODY" "$PR_NUMBER"

      - name: Tag Release
        if: steps.release.outputs.pr
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: master

      - name: Sync master back to release
        if: steps.release.outputs.pr
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Push master to release
        if: steps.release.outputs.pr
        run: git push --force origin master:release
