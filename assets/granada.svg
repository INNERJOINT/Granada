<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Granada Space Fortress -->
  <defs>
    <linearGradient id="fortress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background space -->
  <rect width="200" height="200" fill="#0d1117" rx="16"/>
  <!-- Stars -->
  <circle cx="30" cy="25" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="170" cy="40" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="50" cy="170" r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="160" cy="160" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="90" cy="20" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="140" cy="180" r="1" fill="#fff" opacity="0.5"/>
  <!-- Fortress body - asteroid shape -->
  <ellipse cx="100" cy="100" rx="55" ry="45" fill="url(#fortress)" stroke="#666" stroke-width="1.5"/>
  <!-- Surface details -->
  <ellipse cx="80" cy="90" rx="12" ry="8" fill="none" stroke="#555" stroke-width="0.8"/>
  <ellipse cx="120" cy="105" rx="10" ry="7" fill="none" stroke="#555" stroke-width="0.8"/>
  <!-- Dock opening with glow -->
  <circle cx="100" cy="100" r="12" fill="url(#glow)"/>
  <circle cx="100" cy="100" r="6" fill="#ff6b35" opacity="0.9"/>
  <!-- Antenna structures -->
  <line x1="60" y1="65" x2="45" y2="45" stroke="#888" stroke-width="1.5"/>
  <line x1="140" y1="65" x2="155" y2="45" stroke="#888" stroke-width="1.5"/>
  <circle cx="45" cy="45" r="2.5" fill="#ff6b35"/>
  <circle cx="155" cy="45" r="2.5" fill="#ff6b35"/>
  <!-- Text -->
  <text x="100" y="165" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#e6e6e6">GRANADA</text>
</svg>
